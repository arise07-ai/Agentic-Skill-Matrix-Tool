<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The sidebar logo (components/Nav.tsx, .brand__mark) as the browser-tab icon: the light-mode look on a white tile so it stays
       visible on light and dark tab bars. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6" fill="#FFFFFF" stroke="#E5E7EB" />
  <g transform="translate(2 2)" stroke="#111827" stroke-width="1.6" fill="#111827">
    <rect x="2" y="2" width="6" height="6" fill-opacity="0.18" />
    <rect x="11" y="2" width="6" height="6" fill-opacity="0" />
    <rect x="20" y="2" width="6" height="6" fill-opacity="0" />
    <rect x="2" y="11" width="6" height="6" fill-opacity="0.18" />
    <rect x="11" y="11" width="6" height="6" />
    <rect x="20" y="11" width="6" height="6" fill-opacity="0" />
    <rect x="2" y="20" width="6" height="6" fill-opacity="0.18" />
    <rect x="11" y="20" width="6" height="6" />
    <rect x="20" y="20" width="6" height="6" />
  </g>
</svg>
