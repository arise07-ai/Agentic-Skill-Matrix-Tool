services:
  chroma:
    image: chromadb/chroma:latest   # pin a version for production
    volumes: [chroma_data:/data]    # check your Chroma image's persistence path in its docs
    ports: ["8001:8000"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    volumes: [app_data:/app/data]
    depends_on: [chroma, redis]
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000   # baked into Next.js rewrites at build time
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  chroma_data:
  app_data:
